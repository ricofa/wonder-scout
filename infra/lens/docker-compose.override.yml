# WonderScout local override for Docker Desktop on WSL2 (auto-loaded by `docker compose`).
#
# The official v0.19.0 template bind-mounts the host root and Docker data directory into the
# `monitor` service with `bind.propagation: rslave`. Docker Desktop's VM does not mount `/` as a
# shared mount, so container creation fails with:
#   "path / is mounted on / but it is not a shared mount"
# This override keeps the same read-only binds and only drops the propagation setting
# (default rprivate). Effect: the monitor does not see mounts created after it starts.
# Remove this file on Linux hosts where `/` is a shared mount.
services:
  monitor:
    volumes: !override
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /
        target: /host/root
        read_only: true
      - type: bind
        source: ${SYSTEM_MONITOR_DATA_PATH:-/var/lib/docker}
        target: /host/data
        read_only: true
